        body {

    <script>
        const documentation = getId("Documentation")
        const info = document.querySelector('info')
        const menuui = getId("menu")
        function togglemenu(menu){
            if(menu){
                menuui.classList.add("hidemenu")
            }
            else {
                menuui.classList.remove("hidemenu")
            }
        }
        document.addEventListener("mousemove",(event)=>{
            const x = event.clientX
            const y = event.clientY
            const el = event.target
            if (el.getAttribute("desc")){
                info.style.display = "block"
                info.textContent = el.getAttribute("desc")
                if ((window.innerWidth - x) <= 50) {
                    info.style.top = y + 14 + "px"
                    info.style.left = x - 30 +"px"
                    return
                }
                info.style.top = y + 14 + "px"
                info.style.left = x + 10 +"px"
            }
            else{
                info.style.display = "none"
            }
        })
        let doc;
        function showdocument(name){
            togglemenu(true)
            const self = doc[name.textContent || name]
            genv.name = self.name
            genv.param = self.param
            genv.desc = self.desc
            genv.code = self.code
            genv.explain = self.explain
            genv.params = self.params
            window.history.pushState({},"","?"+ self.name)    
            setTimeout(() => {
                hljs.highlightAll()
                document.querySelectorAll("code").forEach(el => {
                    el.innerHTML = el.innerHTML.replace(
                        /&([^&]*)&/g,
                        (_, text) => `<span class="method">${text}</span>`
                    ).replace(
                        /%([^&]*)%/g,
                        (_, text) => `<span class="function">${text}</span>`
                    ).replaceAll("amp;","")
                })
            }, 50);
            documentation.GetReference = "documentformat.html"
        }
        function copy(self){
            self.textContent = "Copied!"
            const code = self.parentElement.querySelector('code').textContent
            navigator.clipboard.writeText(code)
            setTimeout(() => {
                self.textContent = "Copy"
            }, 3 * 1000);
        }
        function dropdown(self){
            getId(self).classList.toggle("closed")
        }
    </script>
